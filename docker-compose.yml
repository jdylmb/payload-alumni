services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: payload_user
      POSTGRES_PASSWORD: payload_pass
      POSTGRES_DB: alumni_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d alumni_db']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
